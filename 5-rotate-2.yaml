apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: git-cache-pvc-manual-1
  namespace: default
spec:
  dataSource:
    apiGroup: snapshot.storage.k8s.io
    kind: VolumeSnapshot
    name: git-cache-snapshot-manual-1
  accessModes:
    - ReadOnlyMany
  storageClassName: git-cache-sc
  resources:
    requests:
      storage: 100Gi